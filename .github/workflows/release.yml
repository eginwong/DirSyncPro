name: Release Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build-macos:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build macOS app image
        run: |
          chmod +x scripts/package-native.sh
          ./scripts/package-native.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirsyncpro-macos
          path: dist/mac

  build-windows:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Windows EXE
        shell: pwsh
        run: |
          ./scripts/package-native.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirsyncpro-windows
          path: dist/windows

  publish-release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine semver tag
        id: version
        shell: bash
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tr -d '\r')
          if [[ "$VERSION" =~ ^[0-9]+$ ]]; then
            VERSION="${VERSION}.0.0"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semver-like: $VERSION"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create annotated git tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/dirsyncpro-macos/**
            dist/dirsyncpro-windows/**
