name: Develop Snapshot Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-snapshot-macos:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute snapshot version
        id: version
        shell: bash
        run: |
          BASE=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tr -d '\r')
          BASE="${BASE%-SNAPSHOT*}"
          if [[ -z "$BASE" || "$BASE" == "null" ]]; then
            BASE="0.1"
          fi
          VERSION="${BASE}-SNAPSHOT.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set Maven version for this build
        run: mvn -q versions:set -DnewVersion="${{ steps.version.outputs.version }}"

      - name: Build macOS app image
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/package-native.sh
          ./scripts/package-native.sh "$APP_VERSION"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirsyncpro-macos-snapshot-${{ steps.version.outputs.version }}
          path: dist/mac

  build-snapshot-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute snapshot version
        id: version
        shell: bash
        run: |
          BASE=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tr -d '\r')
          BASE="${BASE%-SNAPSHOT*}"
          if [[ -z "$BASE" || "$BASE" == "null" ]]; then
            BASE="0.1"
          fi
          VERSION="${BASE}-SNAPSHOT.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set Maven version for this build
        shell: bash
        run: mvn -q versions:set -DnewVersion="${{ steps.version.outputs.version }}"

      - name: Build Windows app
        shell: pwsh
        run: |
          ./scripts/package-native.ps1 -AppVersion "${{ steps.version.outputs.version }}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirsyncpro-windows-snapshot-${{ steps.version.outputs.version }}
          path: dist/windows
